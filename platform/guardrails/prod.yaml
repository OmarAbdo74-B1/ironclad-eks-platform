apiVersion: v1
kind: ResourceQuota
metadata:
  name: env-quota
  namespace: prod
spec:
  hard:
    requests.cpu: 1500m
    requests.memory: 1536Mi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "15"
    services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: env-defaults
  namespace: prod
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 256Mi
      max:
        cpu: "1"
        memory: 1Gi
