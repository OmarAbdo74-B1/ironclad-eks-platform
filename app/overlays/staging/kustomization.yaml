apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

labels:
  - pairs:
      env: staging

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

images:
  - name: omarabdo4/butcher-cars-backend
    newTag: v1.0.5
  - name: omarabdo4/butcher-cars-frontend
    newTag: v1.0.5

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: staging
  - target:
      kind: Ingress
      name: web-app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.192.168.56.103.nip.io
