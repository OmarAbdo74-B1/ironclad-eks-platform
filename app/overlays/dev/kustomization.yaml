apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
- ../../base

labels:
- pairs:
    env: dev

replicas:
- count: 1
  name: backend
- count: 1
  name: frontend

images:
- name: omarabdo4/butcher-cars-backend
  newName: omarabdo4/butcher-cars-backend
  newTag: v1.1.3
- name: omarabdo4/butcher-cars-frontend
  newName: omarabdo4/butcher-cars-frontend
  newTag: v1.1.4

patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: dev
  target:
    kind: Deployment
    name: backend
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.192.168.56.103.nip.io
  target:
    kind: Ingress
    name: web-app-ingress
