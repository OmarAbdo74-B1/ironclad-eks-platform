apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

labels:
  - pairs:
      env: prod

replicas:
  - name: backend
    count: 4
  - name: frontend
    count: 4

images:
  - name: omarabdo4/butcher-cars-backend
    newTag: v1.0.5
  - name: omarabdo4/butcher-cars-frontend
    newTag: v1.0.5

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: prod
  - target:
      kind: Ingress
      name: web-app-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.192.168.56.103.nip.io
