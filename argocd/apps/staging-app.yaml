apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cars-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: staging-project
  source:
    repoURL: https://github.com/OmarAbdo74-B1/ironclad-eks-platform.git
    targetRevision: main
    path: app/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
